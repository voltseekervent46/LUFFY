name: sync-readme-todos

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Check out dev branch with full history
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Sync README TODO list with dev code
        run: python3 .github/scripts/sync_todos.py

      - name: Commit and push README if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "README.md already up to date"
          else
            git commit -m "docs: sync Complete TODO List with implemented dev code"
            git push origin HEAD:dev
          fi
